#
# AuraPulse CI: locale parity, debug APK, JVM unit tests and Android Lint.
# No Firebase, no emulators, no secrets required.

name: AuraPulse CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4 -Djava.awt.headless=true -Xmx4g'

jobs:
  locale-parity:
    name: Locale parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Every string must exist in every locale with the same format arguments
        run: python3 tools/check_locales.py

  build-and-test:
    name: Assemble, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Provide a debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Report unit-test failures
        if: failure()
        run: python3 tools/report_test_failures.py

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aurapulse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurapulse-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
